[project]
name = "kpi-calculator"
dynamic = ["version"]
requires-python = ">=3.14.10"
authors = [
    { name = "Jesús Andrés Rodríguez Sarasty", email = "jesusandres.rodriguez@deltares.nl" },
]
description = "Extend ESDL's with relevant key performance indicators."
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=2.4.0,<3.0",
    "pandas>=3.0.0,<4.0",
    "pyesdl[profiles]~=26.10",  # Extra supplies influxdb/psycopg/openpyxl
    "xmltodict>=0.14.2",
    "pydantic>=2.12.4,<3.0",
    "urllib3>=2.6.3",
    "filelock>=3.25.0",
]


[dependency-groups]

test = [
    "pytest>=9.0.0,<10.0",
    "pytest-cov>=7.0.0,<8.0",
    "hypothesis>=6.0.0",
    "pytest-xdist>=3.0.0",
]

lint = [
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "pre-commit>=4.0.0",
    "pandas-stubs>=3.0.0",
    "types-xmltodict",
]

analysis = [
    "codespell>=2.0.0",
    "vulture>=2.0.0",
    "pylint>=4.0.0",
    "pipdeptree>=2.0.0",
    "pip-audit>=2.0.0",
]

docs = [
    "sphinx>=8.0",
    "furo>=2025.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autodoc-typehints>=3.0.0",
]

build = [
    "setuptools>=75.0.0",
    "pip>=26.2.2",
    "wheel~=0.46.2",
    "setuptools-git-versioning<3",
    "build>=1.3.0",
    "bump2version==1.0.1",
]

# The 'dev' group aggregates all other dependency groups for full development setup
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "build" },
    { include-group = "analysis" },
]


[project.urls]
homepage = "https://www.nwn.nu"
documentation = "https://kpi-calculator.readthedocs.io/"
repository = "https://github.com/Nieuwe-Warmte-Nu/kpi-calculator"
changelog = "https://github.com/Nieuwe-Warmte-Nu/kpi-calculator/blob/main/CHANGELOG.md"


[project.scripts]
kpicalculator = "kpicalculator:main"


[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=75.0.0",
    "wheel~=0.46.2",
    "setuptools-git-versioning<3",
]


[tool.setuptools-git-versioning]
enabled = true


[tool.setuptools.package-data]
kpicalculator = ["py.typed"]


[tool.pytest.ini_options]
addopts = "--cov=src/kpicalculator --cov-report html --cov-report term-missing --cov-fail-under 80"
testpaths = ["unit_test"]
pythonpath = ["src"]
markers = [
    "obsolete: marks tests as obsolete (replaced by modern implementations)"
]


[tool.coverage.run]
source = ["src"]
omit = [
    "src/kpicalculator/adapters/xml_time_series_adapter.py",
]


[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "venv", "doc", "code_bases"]


[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "C9",
    "UP",
    "S",
    "T20",
    "RET",
    "SIM",
    "PTH",
    "ARG",
    "PIE",
    "RSE",
    "PERF",
    "RUF",
]

ignore = [
    "C408",
    "B019",
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["S101", "S106", "SIM117"]
"unit_test/test_credential_manager.py" = ["B017"]
"src/kpicalculator/adapters/xml_time_series_adapter.py" = ["ALL"]
"src/kpicalculator/security/input_validator.py" = ["C901"]


[tool.ruff.lint.mccabe]
max-complexity = 12


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ['.venv/*', 'venv/*', 'doc/*', 'ci/*']


[[tool.mypy.overrides]]
module = [
    "unit_test.*",
    "pandas.*",
    "xmltodict.*",
    "esdl.*",
    "esdl.esdl_handler.*",
    "jinja2.*",
]
check_untyped_defs = true
ignore_missing_imports = true


[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
fail-under = 80
exclude = ["setup.py", "docs", "build", ".venv", "venv"]
verbose = 0
quiet = false
color = true
omit-covered-files = false