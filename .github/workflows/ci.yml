name: Build-Test-Lint-etc (linux)

on:
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality (Lint + Typecheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --no-editable

      - name: Run lint
        run: |
          uv run ruff check ./src/ ./unit_test/
          uv run ruff format --check ./src/ ./unit_test/

      - name: Add mypy annotator
        uses: pr-annotators/mypy-pr-annotator@v1.0.0

      - name: Run typechecker
        run: |
          uv run mypy ./src/kpicalculator


  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --no-editable

      - name: Run unit tests with coverage
        run: |
          uv run pytest --cov=src/kpicalculator --maxfail=5 --disable-warnings --junit-xml=test-results.xml unit_test/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: htmlcov/

      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true


  build:
    name: Build the python package
    runs-on: ubuntu-latest
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Release: full history with tags for versioning.
          # Regular push: shallow clone for speed.
          fetch-depth: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && 0 || 1 }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Build
        run: |
          uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7


  verify:
    name: Verify package quality
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14.10

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install package from wheel in clean environment
        run: |
          uv venv .venv-test --python 3.14.10
          source .venv-test/bin/activate
          uv pip install dist/*.whl

  